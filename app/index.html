<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peesuto</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/history.ts" defer></script>
  </head>
  <body class="panel history">
    <header class="bar" data-tauri-drag-region>
      <input id="search" class="search" type="search" placeholder="Search history" autocomplete="off" spellcheck="false" data-i18n-placeholder="Search history">
      <div class="menu-anchor">
        <button id="more" class="icon" title="More" aria-label="More" data-i18n-title="More" data-i18n-aria-label="More">⋯</button>
        <div id="more-menu" class="dropdown" hidden>
          <button data-action="clear" data-i18n="Clear all…">Clear all…</button>
          <button data-action="settings" data-i18n="Settings…">Settings…</button>
        </div>
      </div>
    </header>
    <div id="confirm" class="confirm">
      <span id="pick-dot" class="dot" hidden></span>
      <span class="confirm-label" data-i18n="Paste:">Paste:</span>
      <span id="confirm-text" class="confirm-text"></span>
      <span id="pick-spinner" class="spinner tiny" hidden></span>
      <span id="pick-source" class="tag" hidden></span>
      <kbd>⏎</kbd>
    </div>
    <div id="note" class="banner info" hidden><span id="note-text"></span></div>
    <div id="ax-banner" class="banner" hidden>
      <span data-i18n="Pasting for you needs Accessibility access.">Pasting for you needs Accessibility access.</span>
      <button id="ax-allow" class="link" data-i18n="Allow…">Allow…</button>
      <button id="ax-settings" class="link" data-i18n="Settings">Settings</button>
    </div>
    <div id="locked" class="banner" hidden>
      <span id="locked-text" data-i18n="The history is locked.">The history is locked.</span>
      <button id="locked-fresh" class="link danger" data-i18n="Start fresh…">Start fresh…</button>
    </div>
    <div id="fresh-confirm" class="banner" hidden>
      <span data-i18n="Delete the locked history and start over?">Delete the locked history and start over?</span>
      <button id="fresh-yes" class="link danger" data-i18n="Delete">Delete</button>
      <button id="fresh-no" class="link" data-i18n="Keep">Keep</button>
    </div>
    <div id="clear-confirm" class="banner" hidden>
      <span data-i18n="Clear the whole history?">Clear the whole history?</span>
      <button id="clear-yes" class="link danger" data-i18n="Clear">Clear</button>
      <button id="clear-no" class="link" data-i18n="Keep">Keep</button>
    </div>
    <ul id="list" class="list" role="listbox" aria-label="Clipboard history" data-i18n-aria-label="Clipboard history"></ul>
    <p id="empty" class="empty" hidden data-i18n="Nothing copied yet.">Nothing copied yet.</p>
    <div id="context" class="dropdown context" hidden>
      <button data-action="paste" data-i18n="Paste">Paste</button>
      <div id="context-actions"></div>
      <button data-action="pin" data-i18n="Pin">Pin</button>
      <button data-action="delete" class="danger" data-i18n="Delete">Delete</button>
    </div>
    <footer class="hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="select">select</span></span>
      <span><kbd>⏎</kbd> <span data-i18n="paste">paste</span></span>
      <span><kbd>⌘⌫</kbd> <span data-i18n="delete">delete</span></span>
      <span><kbd>esc</kbd> <span data-i18n="close">close</span></span>
    </footer>
  </body>
</html>
