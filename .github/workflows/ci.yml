name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests (no engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test core/tests

  render:
    name: fixtures render at the pinned engine (macOS)
    runs-on: macos-14
    # engine.json pins a tag of the public pocket-motion; no credential needed.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # Pinned: the engine's wasm rasteriser is linked by rust-lld, and the
      # runner's 1.98.1 aborts there (dyld cannot load libLLVM.dylib). 1.97.1
      # is what builds it locally; bump only after a green run.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - name: engine
        run: bun scripts/engine.ts
      - name: fixtures
        run: bun test core/tests/fixtures.test.ts

  shell:
    name: shell (cargo test, macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cd app && bun install --frozen-lockfile
      - run: cd app && bun run test
      - run: cd app && bun run build
      - run: cd app/src-tauri && cargo test

  native:
    name: native Swift desktop (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path native
