<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peesuto</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/result.ts" defer></script>
  </head>
  <body class="panel result">
    <header class="bar" data-tauri-drag-region>
      <span id="title" class="title" data-tauri-drag-region data-i18n="Result">Result</span>
      <span id="status" class="status"></span>
      <button id="close" class="icon" title="Hide (Esc)" aria-label="Hide" data-i18n-title="Hide (Esc)" data-i18n-aria-label="Hide">×</button>
    </header>
    <main>
      <div id="stage" class="stage">
        <img id="card" alt="" hidden />
        <pre id="text-out" class="text-out" hidden></pre>
        <div id="spinner" class="spinner" hidden></div>
        <div id="error" class="error" hidden>
          <p id="error-title" class="error-title"></p>
          <p id="error-detail" class="error-detail"></p>
          <button id="error-settings" class="link" hidden data-i18n="Open Settings…">Open Settings…</button>
        </div>
      </div>
      <div id="card-row" class="row">
        <div class="segmented" id="aspect" role="radiogroup" aria-label="Aspect" data-i18n-aria-label="Aspect">
          <button data-aspect="chat" role="radio" data-i18n="Chat">Chat</button>
          <button data-aspect="doc" role="radio" data-i18n="Doc">Doc</button>
          <button data-aspect="social" role="radio" data-i18n="Social">Social</button>
        </div>
        <button id="another" class="ghost" title="Ask again, ignoring the cached answer" data-i18n="Another take" data-i18n-title="Ask again, ignoring the cached answer">Another take</button>
      </div>
      <div id="text-row" class="row" hidden>
        <span id="model" class="help mono"></span>
        <span class="spacer"></span>
        <button id="again" class="ghost" title="Run again" data-i18n="Again" data-i18n-title="Run again">Again</button>
      </div>
      <div class="row actions">
        <button id="paste" class="primary" data-i18n="Paste">Paste</button>
        <button id="copy" data-i18n="Copy">Copy</button>
        <button id="save" data-i18n="Save…">Save…</button>
        <button id="reveal" class="ghost" data-i18n="Reveal">Reveal</button>
      </div>
      <p id="timing" class="timing"></p>
    </main>
  </body>
</html>
