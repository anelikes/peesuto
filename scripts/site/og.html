<!doctype html>
<!-- Open Graph image for peesuto.com, rendered to site/og.png at 1200×630 by scripts/site-assets.ts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Peesuto Mono"; src: url("../../site/assets/fonts/peesuto-mono-bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Peesuto Mono"; src: url("../../site/assets/fonts/peesuto-mono-regular.woff2") format("woff2"); font-weight: 400; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; display: flex; background: #F6F3EE; color: #1F1B17;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
.copy { width: 600px; padding: 68px 0 60px 80px; box-sizing: border-box; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 14px; font: 700 28px "Peesuto Mono", monospace; }
.brand img { width: 40px; height: 40px; }
h1 { margin: auto 0 0; font: 700 64px/1.04 "Peesuto Mono", monospace; letter-spacing: -0.04em; }
p { margin: 26px 0 0; font-size: 25px; line-height: 1.4; color: #57504A; max-width: 18em; }
.foot { margin-top: auto; display: flex; gap: 22px; align-items: center; font: 400 21px "Peesuto Mono", monospace; color: #6B6359; }
kbd { font: 400 19px "Peesuto Mono", monospace; color: #1F1B17; background: #fff; border: 1px solid #CBC3B7; border-bottom-width: 3px; border-radius: 8px; padding: 4px 10px; }
.art { position: relative; flex: 1; background: #3b2f8f url("../../site/assets/field-indigo.webp") center / cover; }
.art::after { content: ""; position: absolute; inset: 0; background: url("../../site/assets/grain.png") 0 0 / 128px; opacity: .55; mix-blend-mode: overlay; }
.art img.card { position: absolute; width: 300px; height: 300px; border-radius: 16px; box-shadow: 0 2px 6px rgba(20,16,40,.14), 0 24px 60px rgba(20,16,40,.35); z-index: 1; }
</style>
</head>
<body>
<div class="copy">
<div class="brand"><img src="../../site/assets/icon-256.png" alt="">Peesuto</div>
<h1>Copy text.<br>Paste a card.</h1>
<p>A small, open-source clipboard app for the Mac.</p>
<div class="foot"><span>peesuto.com</span><span><kbd>⌥</kbd> <kbd>V</kbd></span></div>
</div>
<div class="art">
<img class="card" src="../../site/cards/text-poster.webp" alt="" style="left:52px;top:60px;transform:rotate(-3deg)">
<img class="card" src="../../site/cards/chat-classic.webp" alt="" style="left:258px;top:250px;transform:rotate(2deg)">
</div>
</body>
</html>
