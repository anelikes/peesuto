name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (no engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test core/tests

  render:
    name: fixtures render at the pinned engine (macOS)
    runs-on: macos-15
    # engine.json pins a tag of the public pocket-motion; no credential needed.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      # The native code is built with Swift 6.x; macos-14's default Xcode 15.4
      # (Swift 5.10) is too old. Select an explicit Xcode so the toolchain
      # does not drift with the runner image's default.
      - name: select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # Pinned: the engine's wasm rasteriser is linked by rust-lld, and the
      # runner's 1.98.1 aborts there (dyld cannot load libLLVM.dylib). 1.97.1
      # is what builds it locally; bump only after a green run.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - name: engine
        run: bun scripts/engine.ts
      - name: fixtures
        run: bun test core/tests/fixtures.test.ts
      - name: bundled emoji
        run: bun scripts/fetch-emoji.ts
      - name: structured templates and animation frames
        run: |
          mkdir -p .work
          cp -R engine .work/template-engine
          PEESUTO_TEMPLATE_ENGINE=.work/template-engine bun test core/tests/template-engine.test.ts
      - name: native app bundle
        run: bun scripts/build-native.ts --engine engine
      - name: standalone native bundle smoke (PNG and GIF)
        run: native/.build/release/PeesutoSmoke native/dist/Peesuto.app

  native:
    name: native Swift desktop (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The native code is built with Swift 6.x; macos-14's default Xcode 15.4
      # (Swift 5.10) is too old. Select an explicit Xcode so the toolchain
      # does not drift with the runner image's default.
      - name: select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: swift --version
      - run: swift test --package-path native
      - run: swift build --package-path native -c release
