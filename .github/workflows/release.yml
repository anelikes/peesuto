# Validation builds only. Tag-triggered publishing is disabled until native
# Developer ID signing, notarization, installation and update delivery exist.
name: native validation build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: native macOS validation artifact (not a release)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # Rust builds Pocket Motion's WASM rasterizer, not the desktop application.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: swift test --package-path native
      - name: prepare pinned engine
        run: bun scripts/engine.ts
      - name: bundled emoji
        run: bun scripts/fetch-emoji.ts
      - name: build native app (local ad-hoc signature only)
        run: bun scripts/build-native.ts --engine engine
      - name: standalone PNG/GIF smoke
        run: native/.build/release/PeesutoSmoke native/dist/Peesuto.app
      - name: archive validation bundle
        run: ditto -c -k --sequesterRsrc --keepParent native/dist/Peesuto.app native/dist/Peesuto-native-validation.zip
      - uses: actions/upload-artifact@v4
        with:
          name: peesuto-native-validation-${{ runner.arch }}-${{ github.sha }}
          path: native/dist/Peesuto-native-validation.zip
          if-no-files-found: error
